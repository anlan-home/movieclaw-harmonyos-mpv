[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[binaries]
c = '/sdk/linux/native/llvm/bin/clang'
cpp = '/sdk/linux/native/llvm/bin/clang++'
ar = '/sdk/linux/native/llvm/bin/llvm-ar'
strip = '/sdk/linux/native/llvm/bin/llvm-strip'
c_ld = '/sdk/linux/native/llvm/bin/ld.lld'
cpp_ld = '/sdk/linux/native/llvm/bin/ld.lld'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['--target=x86_64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion']
cpp_args = ['--target=x86_64-linux-ohos', '--sysroot=/sdk/linux/native/sysroot', '-fPIC', '-D__MUSL__=1', '-Wno-int-conversion']
c_link_args = ['--target=x86_64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
cpp_link_args = ['--target=x86_64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
buildtype = 'release'
default_library = 'static'
wrap_mode = 'nodownload'
